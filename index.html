<style>
:root{--bg:#fbf9fa;--text:#1b1b1b;--accent:#c10e0e;--accent-700:#a50d0d;--muted:#6a6768;--divider:#dcd9da}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Serif TC','Songti TC','PMingLiU',serif;line-height:1.7}
main{max-width:760px;margin:0 auto;padding:40px 20px 80px}

.people{display:block;width:100%;max-width:640px;height:auto;margin:16px auto 0;mix-blend-mode:multiply}
.ground{border-top:1px solid var(--text)}
.intro{text-align:center;color:#4a4849;margin:0 0 28px}
a.card{display:block;border:1px solid var(--text);padding:16px 20px;margin:0 0 14px;background:#fff;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--accent);box-shadow:4px 4px 0 var(--accent)}
a.card b{display:block;font-weight:900;font-size:20px}
a.card span{font-size:13px;color:var(--muted)}
a.card:hover b{color:var(--accent)}
</style>
